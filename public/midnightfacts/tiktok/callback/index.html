<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>TikTok sign-in – MidnightFacts</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 680px; margin: 0 auto; padding: 48px 20px; line-height: 1.6; color: #1d1d1f; background: #fff; }
      h1 { font-size: 1.6rem; }
      code#code { display: block; word-break: break-all; padding: 12px; border-radius: 8px; background: #f2f2f4; font-size: 0.95rem; }
      button { margin-top: 12px; font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #c7c7cc; background: transparent; color: inherit; cursor: pointer; }
      .error { color: #c62828; }
      .meta { color: #6e6e73; }
      @media (prefers-color-scheme: dark) { body { color: #f5f5f7; background: #111; } code#code { background: #222; } .meta { color: #a1a1a6; } button { border-color: #48484a; } }
    </style>
  </head>
  <body>
    <h1>TikTok sign-in</h1>
    <div id="ok" hidden>
      <p>Copy this one-time connection code and paste it into the sign-in prompt in your terminal:</p>
      <code id="code"></code>
      <button id="copy" type="button">Copy code</button>
      <p class="meta">The code is shown only on this page and is not sent anywhere. It expires within minutes.</p>
    </div>
    <p id="err" class="error" hidden></p>
    <p class="meta">OpenClaw Shorts · <a href="/midnightfacts/privacy/">Privacy</a> · <a href="/midnightfacts/terms/">Terms</a></p>
    <script>
      // Shows TikTok's OAuth callback values for the owner to paste into the server's sign-in prompt.
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");
      if (code && state && !error) {
        document.getElementById("code").textContent = state + "|" + code;
        document.getElementById("ok").hidden = false;
        document.getElementById("copy").addEventListener("click", async () => {
          await navigator.clipboard.writeText(state + "|" + code);
          document.getElementById("copy").textContent = "Copied";
        });
      } else {
        const err = document.getElementById("err");
        err.textContent = "TikTok did not return a code" + (error ? ": " + error + " " + (params.get("error_description") || "") : ".");
        err.hidden = false;
      }
      // Drop the code from the address bar and browser history.
      history.replaceState(null, "", window.location.pathname);
    </script>
  </body>
</html>
