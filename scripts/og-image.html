<!doctype html>
<!-- Source for public/og-image.png (1200×630). Regenerate with: npm run og-image -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face { font-family: "VT323"; src: url("../public/fonts/vt323-400.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; src: url("../public/fonts/jetbrains-mono-variable.woff2") format("woff2"); font-weight: 400 700; }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #020202; }
      .frame {
        position: absolute; inset: 24px; border: 6px solid #111; border-radius: 32px; background: #050505;
        box-shadow: inset 0 0 120px rgba(0, 255, 65, 0.06); overflow: hidden;
        display: flex; align-items: center; justify-content: space-between; padding: 0 72px;
      }
      .frame::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 8, 3, 0.35) 50%); background-size: 100% 4px;
      }
      .glow { position: absolute; width: 520px; height: 520px; right: -80px; top: -120px; background: rgba(0, 153, 34, 0.18); filter: blur(120px); border-radius: 50%; }
      .text { position: relative; z-index: 1; max-width: 640px; }
      .badge {
        display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px; border-radius: 999px;
        border: 1px solid rgba(0, 153, 34, 0.4); background: rgba(0, 153, 34, 0.1);
        color: #00b82a; font: 600 16px "JetBrains Mono", monospace; letter-spacing: 0.15em; text-transform: uppercase;
      }
      .badge i { width: 9px; height: 9px; border-radius: 50%; background: #00b82a; }
      h1 { font: 112px/0.9 "VT323", monospace; color: #00b82a; letter-spacing: 0.04em; margin: 28px 0 18px; text-shadow: 0 0 18px rgba(0, 255, 65, 0.35); }
      h2 { font: 700 34px "JetBrains Mono", monospace; color: #e5e7eb; margin-bottom: 18px; }
      p { font: 400 22px/1.5 "JetBrains Mono", monospace; color: #9ca3af; }
      .url { margin-top: 30px; font: 500 22px "JetBrains Mono", monospace; color: #00b82a; }
      .portrait {
        position: relative; z-index: 1; width: 320px; height: 320px; padding: 10px; border-radius: 20px;
        border: 1px solid rgba(0, 153, 34, 0.45); background: #050505; box-shadow: 0 0 60px rgba(0, 255, 65, 0.12);
      }
      .portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; filter: grayscale(1) contrast(1.25); }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="glow"></div>
      <div class="text">
        <span class="badge"><i></i>Android · Kotlin · Compose</span>
        <h1>ANDRII KOZAKOV_</h1>
        <h2>Senior Android Engineer</h2>
        <p>12+ years · team &amp; tech lead. Streaming for 15M+ users, secure healthcare apps, real-time video.</p>
        <div class="url">&gt;_ kozakov.me</div>
      </div>
      <div class="portrait"><img src="../public/avatar.webp" alt="" /></div>
    </div>
  </body>
</html>
